[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true                        # registerSong has many params -> avoids "stack too deep"
evm_version = "cancun"               # Base supports Cancun
fs_permissions = [{ access = "read", path = "./"}]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 32

# Named RPC endpoints — use with `forge test --fork-url base` / `forge script --rpc-url base`.
# Values read from env so no secrets land in the repo.
[rpc_endpoints]
base = "${BASE_RPC_URL}"
mainnet = "${L1_RPC_URL}"
# Arc testnet (chainId 5042002) — registry + USDC payment chain. `--rpc-url arc`.
arc = "${ARC_RPC_URL}"

[etherscan]
# For `forge verify-contract` after deploy (Basescan via the unified Etherscan v2 API).
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
# Arc uses ArcScan (Blockscout-style), not Etherscan. To verify on Arc, append to the forge command:
#   --verifier blockscout --verifier-url https://testnet.arcscan.app/api
# (no API key needed). Deploy success is what gates the smoke test; verify can be done after.

# See https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
